
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 340" preserveAspectRatio="none">
  <defs>
    <linearGradient id="footerGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#294F40"/>
      <stop offset="55%" stop-color="#244A3D"/>
      <stop offset="100%" stop-color="#1D382C"/>
    </linearGradient>

    <linearGradient id="footerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8C0A4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A8C0A4" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#D8C8A6" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <!-- Filled wave creates the actual curved footer silhouette -->
  <path
    d="M0 78
       C190 18 330 24 500 67
       S785 125 960 69
       S1260 15 1440 62
       L1440 340 L0 340 Z"
    fill="url(#footerGreen)"
  />

  <!-- Soft glow inside the green surface -->
  <path
    d="M0 78
       C190 18 330 24 500 67
       S785 125 960 69
       S1260 15 1440 62
       L1440 165
       C1240 110 1110 150 950 172
       S650 165 470 125
       S170 85 0 150 Z"
    fill="url(#footerGlow)"
  />

  <!-- Sage wave -->
  <path
    d="M0 78 C190 18 330 24 500 67 S785 125 960 69 S1260 15 1440 62"
    stroke="#C6D8BE"
    stroke-opacity=".8"
    stroke-width="1.5"
    fill="none"
  />

  <!-- Warm sand wave -->
  <path
    d="M0 99 C190 39 330 45 500 88 S785 146 960 90 S1260 36 1440 83"
    stroke="#D8C8A6"
    stroke-opacity=".85"
    stroke-width="1.5"
    fill="none"
  />

  <!-- Restrained terracotta accent -->
  <path
    d="M0 119 C190 59 330 65 500 108 S785 166 960 110 S1260 56 1440 103"
    stroke="#C38C70"
    stroke-opacity=".46"
    stroke-width="1.2"
    fill="none"
  />

  <!-- Additional subtle lines within the footer -->
  <path
    d="M0 230 C230 195 360 215 570 250 S950 285 1160 240 S1350 210 1440 225"
    stroke="#C6D8BE"
    stroke-opacity=".11"
    stroke-width="1.3"
    fill="none"
  />

  <path
    d="M0 254 C230 219 370 239 580 274 S950 309 1160 264 S1350 234 1440 249"
    stroke="#D8C8A6"
    stroke-opacity=".10"
    stroke-width="1.3"
    fill="none"
  />

  <circle cx="1130" cy="43" r="3" fill="#D8C8A6" fill-opacity=".85"/>
  <circle cx="1190" cy="55" r="2" fill="#C6D8BE" fill-opacity=".9"/>
</svg>
